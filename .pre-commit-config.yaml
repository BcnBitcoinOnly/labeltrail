# pre-commit hooks: the same ones run in CI (.forgejo/workflows/lint.yml).
#
# Once per clone:
#   pipx install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# By hand over the whole repo:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  # Label exports and xpubs must never land in the repo.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # ruff defaults (lint only, no formatter).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check

  # markdownlint defaults.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # Scope required. No --strict: it rejects merge commits.
        args: [--force-scope, feat, fix, docs, refactor, chore, ci, style, test, build, perf, revert]

fail_fast: false
default_language_version:
  python: python3
